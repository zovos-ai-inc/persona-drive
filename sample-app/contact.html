<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact · Lumen Helpdesk</title><link rel="stylesheet" href="/site.css"></head>
<body>
<main id="main">
<h1>Contact us</h1>
<p class="lead">Sales, support or a demo: one form.</p>
<div id="sent" class="alert" role="alert" hidden>Thanks, your message is in the queue. We reply within one business day.</div>
<form id="contact" aria-label="Contact form">
  <label for="name">Your name</label><input id="name" name="name" required>
  <label for="email">Work email</label><input id="email" name="email" type="email" required>
  <label for="topic">Topic</label>
  <select id="topic" name="topic"><option>Sales</option><option>Support</option><option>Request a demo</option><option>Press</option></select>
  <label for="message">Message</label><textarea id="message" name="message" rows="4" required></textarea>
  <p><button class="primary" type="submit">Send message</button></p>
</form>
</main>
<script src="/chrome.js"></script>
<script>
document.getElementById("contact").addEventListener("submit", async (e) => {
  e.preventDefault()
  const form = e.target
  const res = await fetch("/api/contact", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(form))) })
  if (res.ok) { form.hidden = true; document.getElementById("sent").hidden = false }
})
</script>
</body>
</html>
