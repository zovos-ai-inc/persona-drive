name: CI

# Static checks and unit tests only: no browser, no Jev, no secrets. Runs are made on
# demand from a machine that can reach the target and holds a TypeSafe key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # gitleaks v8.30.1, the pin zovos-ai-inc/ci-workflows' gitleaks job and
    # zovos-platform use (zovos-platform#8953). Inline, not a call to that workflow:
    # this repo is public, and a public repo cannot use a private repo's workflows.
    # The SHA256 is the linux_x64 line of gitleaks_8.30.1_checksums.txt.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the PR's or the push's commits
      # A PR scans its own commits, a push to main the pushed range, a manual
      # dispatch the whole history. Exit 2 = leaks found (redacted, in this log).
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan for committed secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=(git . --redact --no-banner --exit-code=2)
          case "$EVENT_NAME" in
            pull_request) args+=("--log-opts=--no-merges --first-parent ${PR_BASE}..${PR_HEAD}") ;;
            push) args+=("--log-opts=--no-merges --first-parent ${PUSH_BEFORE}..${PUSH_AFTER}") ;;
          esac
          "$RUNNER_TEMP/gitleaks" "${args[@]}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
