name: Release

# Publishes @zovos-ai-inc/persona-drive to npm when a v* tag is pushed, after the same
# gates as CI. Authentication is npm trusted publishing (OIDC from this workflow, no
# token): the package's trusted publisher on npmjs.com names this repo and workflow
# file. Provenance is attached automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
