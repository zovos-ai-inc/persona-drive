version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates share one PR; majors stay ungrouped so each is
      # reviewed alone (a grouped TypeScript 7 major broke npm ci in #3).
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
