# An agent working the sample ticket app (/app.html). The write goals create or change
# tickets held in the browser tab only; run them with --allow-writes.
name: Tomasz Nowak
role: Support agent on his second day
cares: >-
  Was shown the queue once and left alone with it. Wants to clear what is late
  first, find a specific ticket a colleague mentioned, and not break anything.
  Reads labels carefully and will not click something that looks like it deletes.
goals:
  - id: find-ticket
    text: Open ticket TCK-1042 and see its status and who it is assigned to.
    start: /app.html
  - id: overdue
    text: See only the tickets that are overdue.
    start: /app.html
  - id: export
    text: Export the reports as a CSV file.
    start: /app.html
    writes: true
  - id: new-ticket
    text: Create a ticket titled "Printer on floor 2 offline" and see it in the list.
    start: /app.html
    writes: true
  - id: resolve
    text: Open ticket TCK-1039 and mark it resolved.
    start: /app.html
    writes: true
